apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hw6-ingress-tls
  namespace: hw6
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hw6.example.com
      secretName: hw6-tls
  rules:
    - host: hw6.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hw6-web-service
                port:
                  number: 80
