apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw14-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hw14-backend
  template:
    metadata:
      labels:
        app: hw14-backend
    spec:
      containers:
        - name: multitool
          image: wbitt/network-multitool
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "8080"
