apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hw14-strip-api
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hw14-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-hw14-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hw14-backend
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: hw14-frontend
                port:
                  number: 80
