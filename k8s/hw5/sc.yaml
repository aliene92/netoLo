apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hw5-local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hw5-sc-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hw5-local-storage
  local:
    path: /var/lib/k8s-homework-5/sc
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hw5-sc-pvc
  namespace: hw5
spec:
  storageClassName: hw5-local-storage
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
  namespace: hw5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                echo "$(date) - storageclass data written by busybox" >> /data/storageclass.log
                sleep 5
              done
          volumeMounts:
            - name: storage-data
              mountPath: /data

        - name: multitool
          image: wbitt/network-multitool
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                sleep 3600
              done
          volumeMounts:
            - name: storage-data
              mountPath: /data

      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: hw5-sc-pvc
