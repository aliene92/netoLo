apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  namespace: hw5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
        - name: busybox
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                echo "$(date) - data written by busybox" >> /data/shared.log
                sleep 5
              done
          volumeMounts:
            - name: shared-data
              mountPath: /data

        - name: multitool
          image: wbitt/network-multitool
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                sleep 3600
              done
          volumeMounts:
            - name: shared-data
              mountPath: /data

      volumes:
        - name: shared-data
          emptyDir: {}
