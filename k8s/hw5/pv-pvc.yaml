apiVersion: v1
kind: PersistentVolume
metadata:
  name: hw5-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/k8s-homework-5/pv
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hw5-pvc
  namespace: hw5
spec:
  volumeName: hw5-pv
  storageClassName: ""
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
  namespace: hw5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
        - name: busybox
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                echo "$(date) - persistent data written by busybox" >> /data/persistent.log
                sleep 5
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /data

        - name: multitool
          image: wbitt/network-multitool
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                sleep 3600
              done
          volumeMounts:
            - name: persistent-data
              mountPath: /data

      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: hw5-pvc
