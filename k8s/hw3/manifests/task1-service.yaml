apiVersion: v1
kind: Service
metadata:
  name: task1-service
  labels:
    app: task1-app
spec:
  type: ClusterIP
  selector:
    app: task1-app
  ports:
    - name: nginx-http
      protocol: TCP
      port: 80
      targetPort: nginx-http

    - name: multitool-http
      protocol: TCP
      port: 8080
      targetPort: multitool-http
