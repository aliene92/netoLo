apiVersion: v1
kind: Pod
metadata:
  name: task1-client
  labels:
    app: task1-client
spec:
  containers:
    - name: multitool
      image: wbitt/network-multitool:3.22.2
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            sleep 3600
          done
  restartPolicy: Always
