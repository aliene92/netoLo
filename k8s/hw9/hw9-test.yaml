apiVersion: v1
kind: Namespace
metadata:
  name: hw9-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: hw9-test
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nginx-test
      containers:
        - name: nginx
          image: nginx:1.28.0
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: hw9-test
spec:
  selector:
    app: nginx-test
  ports:
    - port: 80
      targetPort: 80
